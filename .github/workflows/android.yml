name: Android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  ANDROID_API: "36"
  GECKO_ANDROID_API: "37.2"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "16111833"

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "platforms;android-${GECKO_ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify and build debug APK
        run: ./gradlew testDebugUnitTest standaloneJavaTests lintDebug assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TramTruyenReader-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "16111833"

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "platforms;android-${GECKO_ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Missing repository secret ANDROID_KEYSTORE_BASE64"
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed base and Gecko APKs
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" \
            && test -n "$RELEASE_KEY_ALIAS" \
            && test -n "$RELEASE_KEY_PASSWORD" || {
              echo "::error::Missing Android signing secrets"
              exit 1
            }
          ./gradlew testReleaseUnitTest standaloneJavaTests lintRelease :app:bundleRelease \
            -PstandaloneGeckoSplit=true --stacktrace
          bundletool_jar="$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --retry 3 --output "$bundletool_jar" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$bundletool_jar" | sha256sum -c

          store_password_file="$(mktemp)"
          key_password_file="$(mktemp)"
          trap 'rm -f "$store_password_file" "$key_password_file"' EXIT
          printf '%s\n' "$RELEASE_STORE_PASSWORD" > "$store_password_file"
          printf '%s\n' "$RELEASE_KEY_PASSWORD" > "$key_password_file"
          apk_set="$RUNNER_TEMP/tramtruyen.apks"
          java -jar "$bundletool_jar" build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab --output="$apk_set" \
            --ks="$RELEASE_STORE_FILE" --ks-key-alias="$RELEASE_KEY_ALIAS" \
            --ks-pass="file:$store_password_file" --key-pass="file:$key_password_file"

          base_apk="TramTruyenReader-${GITHUB_REF_NAME}.apk"
          unzip -p "$apk_set" splits/base-master.apk > "$base_apk"
          unzip -p "$apk_set" splits/gecko-master.apk > TramTruyen-Gecko.apk
          unzip -Z1 TramTruyen-Gecko.apk | grep -Fx 'lib/arm64-v8a/libxul.so'
          unzip -Z1 TramTruyen-Gecko.apk | grep -Fx 'assets/stv_reader/manifest.json'
          for apk in "$base_apk" TramTruyen-Gecko.apk; do
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$apk"
            "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TramTruyenReader-${{ github.ref_name }}.apk
            TramTruyen-Gecko.apk
