plugins {
    id "com.android.dynamic-feature"
}

android {
    namespace = "vn.tramtruyen.reader.gecko"
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }
    defaultConfig { minSdk = 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

abstract class PrepareChapterExtension extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getChapterScript()
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getAdBlockAssets()
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void writeScript() {
        def packageDir = outputDirectory.dir("stv_reader").get().asFile
        packageDir.mkdirs()
        new File(packageDir, "sangtacviet_chapter.js").bytes = chapterScript.get().asFile.bytes
        def adBlockDir = outputDirectory.dir("tramtruyen_adblock").get().asFile
        adBlockDir.mkdirs()
        adBlockAssets.files.each { file ->
            new File(adBlockDir, file.name).bytes = file.bytes
        }
    }
}

def prepareChapterExtension = tasks.register("prepareChapterExtension", PrepareChapterExtension) {
    def appAssets = project(":app").layout.projectDirectory.dir("src/main/assets")
    chapterScript.set(appAssets.file("sangtacviet_chapter.js"))
    adBlockAssets.from(
        appAssets.file("adblock_rules.json"),
        appAssets.file("adblock_cosmetic.js"),
        appAssets.file("browser_ad_guard.js")
    )
    outputDirectory.set(layout.buildDirectory.dir("generated/chapter-assets"))
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(prepareChapterExtension) { it.outputDirectory }
    }
}

dependencies {
    implementation project(":app")
    def readerAbi = providers.gradleProperty("readerAbi").getOrElse("arm64-v8a")
    implementation "org.mozilla.geckoview:geckoview-${readerAbi}:160.0.20261116130455"
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "com.google.android.play:feature-delivery:2.1.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}

