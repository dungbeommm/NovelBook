pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://maven.mozilla.org/maven2/"
            content { includeGroup("org.mozilla.geckoview") }
        }
    }
}

rootProject.name = "TramTruyenReader"
include ":app"
include ":gecko"

include ":tts:core"
include ":tts:Piper"
include ":tts:ViFast"
include ":tts:VieNeu"
include ":tts:VieNeuNano"
include ":tts:Supertonic"
include ":tts:Korva"
